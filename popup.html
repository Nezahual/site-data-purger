<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>SiteDataPurge</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <header>
      <h3 data-i18n="popup_header_title">🧹 Limpiar datos</h3>
    </header>

    <div class="main-content">
      <div id="pro-features" style="margin-bottom: 12px;">
        <div class="form-group">
          <label for="domain-select" data-i18n="popup_select_label">Selecciona un dominio:</label>
          <select id="domain-select">
            <option value="" data-i18n="popup_loading_domains">Cargando dominios...</option>
          </select>
          
          <div id="unconfigured-state" style="display: none; margin-top: 10px; padding: 8px; background: var(--bg-color); border-radius: 6px; text-align: center; border: 1px dashed var(--border-color);">
            <span style="font-size: 0.8rem; display: block; margin-bottom: 6px;" data-i18n="popup_unconfigured_site">Sitio no configurado</span>
            <button id="btn-configure-current" class="btn btn-thin btn-secondary" style="width: 100%; font-size: 0.8rem;" data-i18n="popup_btn_add_config">⚙️ Añadir a la configuración</button>
          </div>
        </div>

        <div class="actions-row">
          <button id="btn-clear" class="btn btn-danger" disabled data-i18n="popup_btn_clear">Borrar datos</button>
          <button id="btn-reload" class="btn btn-secondary" data-i18n="popup_btn_reload">Recargar</button>
        </div>
      </div>

      <div class="quick-actions" style="display: flex; flex-direction: column; gap: 8px;">
        <button id="btn-quick-cookies" class="btn btn-thin btn-secondary" title="Borrar cookies e ignorar la caché visual" data-i18n="popup_btn_quick_cookies">🍪 Borrar solo cookies + F5 (página actual)</button>
        <button id="btn-quick-cache" class="btn btn-thin btn-secondary" title="Borrar caché de todo el navegador" data-i18n="popup_btn_quick_cache">⚡ Borrar solo caché + F5 (todo el navegador)</button>
      </div>

      <div id="status-message" class="status-msg"></div>
    </div>

    <footer>
      <a href="#" id="open-options" data-i18n="popup_link_config">⚙️ Configuración</a>
    </footer>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
